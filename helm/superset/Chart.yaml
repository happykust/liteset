apiVersion: v2
appVersion: "1.0.0"
description: Liteset — an async (Litestar/ASGI) port of Apache Superset, a modern, enterprise-ready business intelligence web application
name: liteset
icon: https://raw.githubusercontent.com/happykust/liteset/main/docs/static/img/liteset-logo-icon-only.png
home: https://liteset.happykust.dev/
keywords:
  - business intelligence
  - data science
sources:
  - https://github.com/happykust/liteset
maintainers:
  - name: happykust
    email: me@happykust.dev
    url: https://github.com/happykust
version: 1.0.0
dependencies:
  - name: postgresql
    version: 13.4.4
    repository: oci://registry-1.docker.io/bitnamicharts
    condition: postgresql.enabled
  - name: redis
    version: 17.9.4
    repository: oci://registry-1.docker.io/bitnamicharts
    condition: redis.enabled
