[build-system]
requires = ["setuptools>=40.9.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "liteset"
description = "Async version of Apache Superset powered by Litestar"
readme = "README.md"
dynamic = ["version"]
requires-python = ">=3.10, <3.13"
license = { file="LICENSE.txt" }
authors = [
    { name = "Apache Software Foundation", email = "dev@superset.apache.org" },
    { name = "Kirill Nikolaevsky", email = "me@happykust.dev" },
]
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    # --------------------------
    # Liteset core (async web framework + server)
    # --------------------------
    "litestar[standard]>=2.15.0",
    "uvicorn[standard]>=0.34.0",
    "uvloop>=0.21.0; sys_platform != 'win32'",
    "anyio>=4.8.0",
    # --------------------------
    # Data layer (SQLAlchemy 2.0 async + drivers)
    # --------------------------
    "sqlalchemy>=2.0, <2.1",
    "sqlalchemy-utils>=0.38.3, <0.39",
    "asyncpg>=0.30.0",
    "aiosqlite>=0.21.0",
    "greenlet>=3.0.3, <=3.1.1",  # required by SQLAlchemy run_sync()
    "alembic>=1.13.0",
    "Mako>=1.2.2",
    # --------------------------
    # Serialization & validation
    # --------------------------
    "msgspec>=0.19.0",
    "pydantic-settings>=2.7.0",
    # --------------------------
    # Async infrastructure
    # --------------------------
    "redis>=4.6.0, <6.0",
    "celery>=5.3.6, <6.0.0",
    "structlog>=25.5.0",
    # --------------------------
    # CLI
    # --------------------------
    "click>=8.0.3",
    "click-option-group",
    "colorama",
    # --------------------------
    # Security & auth
    # --------------------------
    "cryptography>=42.0.4, <45.0.0",
    "PyJWT>=2.4.0, <3.0",
    "itsdangerous>=2.1.0",  # session cookie decoding (Flask compat)
    "ldap3>=2.9.1, <3",  # async-friendly pure-Python LDAP client
    "paramiko>=3.4.0",
    "sshtunnel>=0.4.0, <0.5",
    # --------------------------
    # Data processing & analytics
    # --------------------------
    "numpy>1.23.5, <2.3",
    "pandas[excel]>=2.1.4, <2.2",
    "bottleneck",  # pandas performance dependency
    "pyarrow>=16.1.0, <19",
    "sqlglot>=27.15.2, <28",
    # --------------------------
    # Utilities
    # --------------------------
    "backoff>=1.8.0",
    "croniter>=0.3.28",
    "cron-descriptor",
    "hashids>=1.3.1, <2",
    "holidays>=0.45, <1",
    "humanize",
    "isodate",
    "jsonpath-ng>=1.6.1, <2",
    "markdown>=3.0",
    "msgpack>=1.0.0, <1.1",
    "nh3>=0.2.11, <0.3",
    "packaging",
    "parsedatetime",
    "pgsanity",
    "Pillow>=11.0.0, <12",
    "polyline>=2.0.0, <3.0",
    "prison>=0.2.1, <1.0",  # Rison parameter encoding/decoding
    "pyparsing>=3.0.6, <4",
    "python-dateutil",
    "python-geohash",
    "pyyaml>=6.0.0, <7.0.0",
    "selenium>=4.14.0, <5.0",  # thumbnail generation
    "simplejson>=3.15.0",
    "slack_sdk>=3.19.0, <4",
    "tabulate>=0.9.0, <1.0",
    "typing-extensions>=4, <5",
    "xlsxwriter>=3.0.7, <3.1",
    "geopy",
    # --------------------------
    # Async database driver extras
    # --------------------------
    "aiotrino>=0.3.0",
    "psycopg2-binary>=2.9.11",
    "babel>=2.18.0",
    # --------------------------
    # Misc runtime deps that used to live only in requirements/base.in.
    # Listing them here makes pyproject.toml the single source of truth so
    # ``uv pip install -e .`` (used in dev/lean Docker stages) is sufficient
    # to bring up the app without an extra ``-r base.txt`` step.
    # --------------------------
    "urllib3==2.5.0",
    "numexpr>=2.9.0",
    "async_timeout>=4.0.0,<5.0.0",
    "apispec>=6.0.0,<6.7.0",
    "openapi-schema-validator>=0.6.3",
]

[project.optional-dependencies]

athena = ["pyathena[pandas]>=2, <3"]
aurora-data-api = ["preset-sqlalchemy-aurora-data-api>=0.2.8,<0.3"]
bigquery = [
    "pandas-gbq>=0.19.1",
    "sqlalchemy-bigquery>=1.15.0",
    "google-cloud-bigquery>=3.10.0",
]
clickhouse = ["clickhouse-connect>=0.5.14, <1.0"]
cockroachdb = ["cockroachdb>=0.3.5, <0.4"]
crate = ["sqlalchemy-cratedb>=0.40.1, <1"]
databend = ["databend-sqlalchemy>=0.3.2, <1.0"]
databricks = [
    "databricks-sql-connector>=2.0.2, <3",
    "sqlalchemy-databricks>=0.2.0",
]
db2 = ["ibm-db-sa>0.3.8, <=0.4.0"]
denodo = ["denodo-sqlalchemy~=1.0.6"]
dremio = ["sqlalchemy-dremio>=1.2.1, <4"]
drill = ["sqlalchemy-drill>=1.1.4, <2"]
druid = ["pydruid>=0.6.5,<0.7"]
duckdb = ["duckdb>=1.4.2,<2", "duckdb-engine>=0.17.0"]
dynamodb = ["pydynamodb>=0.4.2"]
solr = ["sqlalchemy-solr >= 0.2.0"]
elasticsearch = ["elasticsearch-dbapi>=0.2.9, <0.3.0"]
exasol = ["sqlalchemy-exasol>=4, <5"]
excel = ["xlrd>=2.0.1, <3"]
firebird = ["sqlalchemy-firebird>=0.7.0, <0.8"]
firebolt = ["firebolt-sqlalchemy>=1.0.0, <2"]
gevent = ["gevent>=23.9.1"]
gsheets = ["shillelagh[gsheetsapi]>=1.4.3, <2"]
hana = ["hdbcli==2.4.162", "sqlalchemy_hana==0.4.0"]
hive = [
    "pyhive[hive]>=0.6.5;python_version<'3.11'",
    "pyhive[hive_pure_sasl]>=0.7.0",
    "tableschema",
    "thrift>=0.14.1, <1.0.0",
    "thrift_sasl>=0.4.3, < 1.0.0",
]
impala = ["impyla>=0.18, <1"]
kusto = ["sqlalchemy-kusto>=3.0.0, <4"]
kylin = ["kylinpy>=2.8.1, <2.9"]
motherduck = ["duckdb>=1.4.2,<2", "duckdb-engine>=0.17.0"]
mssql = ["pymssql>=2.2.8, <3"]
mysql = ["mysqlclient>=2.1.0, <3"]
ocient = [
    "sqlalchemy-ocient>=1.0.0",
    "pyocient>=1.0.15, <2",
    "shapely",
    "geojson",
]
oracle = ["cx-Oracle>8.0.0, <8.1"]
parseable = ["sqlalchemy-parseable>=0.1.3,<0.2.0"]
pinot = ["pinotdb>=5.0.0, <6.0.0"]
playwright = ["playwright>=1.37.0, <2"]
postgres = ["psycopg2-binary>=2.9.9, <3"]
presto = ["pyhive[presto]>=0.6.5"]
trino = ["trino>=0.328.0"]
prophet = ["prophet>=1.1.6, <2"]
redshift = ["sqlalchemy-redshift>=0.8.1, <0.9"]
risingwave = ["sqlalchemy-risingwave"]
shillelagh = ["shillelagh[all]>=1.4.3, <2"]
singlestore = ["sqlalchemy-singlestoredb>=1.1.1, <2"]
snowflake = ["snowflake-sqlalchemy>=1.2.4, <2"]
spark = [
    "pyhive[hive]>=0.6.5;python_version<'3.11'",
    "pyhive[hive_pure_sasl]>=0.7",
    "tableschema",
    "thrift>=0.14.1, <1",
]
tdengine = [
    "taospy>=2.7.21",
    "taos-ws-py>=0.3.8"
]
teradata = ["teradatasql>=16.20.0.23"]
thumbnails = [] # deprecated, will be removed in 7.0
vertica = ["sqlalchemy-vertica-python>=0.5.9, < 0.6"]
netezza = ["nzalchemy>=11.0.2"]
starrocks = ["starrocks>=1.0.0"]
doris = ["pydoris>=1.0.0, <2.0.0"]
oceanbase = ["oceanbase_py>=0.0.1"]
ydb = ["ydb-sqlalchemy>=0.1.2"]
development = [
    "docker",
    "freezegun",
    "grpcio>=1.55.3",
    "mypy>=1.15.0",
    "openapi-spec-validator",
    "parameterized",
    "pip",
    "pre-commit",
    "progress>=1.5, <2",
    "psutil",
    "pyfakefs",
    "pyinstrument>=4.0.2, <5",
    "pylint",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov",
    "pytest-mock",
    "python-ldap>=3.4.4",
    "ruff",
    "sqloxide",
    "statsd",
    "httpx>=0.27.0",  # litestar test client
    # Type stubs for ``uv run mypy superset`` (mirror the pre-commit hook's
    # additional_dependencies so local + CI type-checking match).
    "types-croniter",
    "types-Markdown",
    "types-paramiko",
    "types-python-dateutil",
    "types-pytz",
    "types-PyYAML",
    "types-redis",
    "types-requests",
    "types-setuptools",
    "types-simplejson",
]

[project.scripts]
superset = "superset.cli.main:superset_cli"
liteset = "superset.cli.main:superset_cli"

[project.urls]
homepage = "https://liteset.happykust.dev/"
documentation = "https://liteset.happykust.dev/docs/intro"


[tool.isort]
combine_as_imports = true
include_trailing_comma = true
line_length = 88
known_first_party = "superset"
known_third_party = "alembic, backoff, celery, click, colorama, cron_descriptor, croniter, cryptography, dateutil, holidays, humanize, isodate, jinja2, jwt, litestar, markdown, msgpack, msgspec, nh3, numpy, pandas, parameterized, parsedatetime, pgsanity, polyline, prison, progress, pydantic, pydantic_settings, pyarrow, pyparsing, pytest, pytest_mock, pytz, redis, requests, selenium, setuptools, simplejson, slack, sqlalchemy, sqlalchemy_utils, structlog, typing_extensions, urllib3, uvicorn, yaml"
multi_line_output = 3
order_by_type = false

[tool.mypy]
plugins = ["sqlalchemy.ext.mypy.plugin"]
check_untyped_defs = true
disallow_any_generics = true
disallow_untyped_calls = true
disallow_untyped_defs = true
ignore_missing_imports = true
no_implicit_optional = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = "superset.migrations.versions.*"
ignore_errors = true

# Vendored Apache Superset 6.0.0 reference source — kept verbatim for 1:1
# porting work; not part of the Liteset distribution and intentionally
# unmaintained as far as the type-checker is concerned.
[[tool.mypy.overrides]]
module = "superset_old.*"
ignore_errors = true
follow_imports = "skip"

[[tool.mypy.overrides]]
module = "tests.*"
check_untyped_defs = false
disallow_untyped_calls = false
disallow_untyped_defs = false
disable_error_code = "annotation-unchecked"

# TODO: remove this once cryptography is fixed, introduced in cryptography 44.0.3
[[tool.mypy.overrides]]
module = "cryptography.*"
ignore_errors = true
follow_imports = "skip"

# advanced_alchemy is a third-party dependency, not project code. mypy's
# SQLAlchemy plugin crashes (INTERNAL ERROR) while following imports into its
# slug mixin; skip analysing its source (we only type-check our *use* of it).
[[tool.mypy.overrides]]
module = "advanced_alchemy.*"
ignore_errors = true
follow_imports = "skip"

[tool.ruff]
# Exclude a variety of commonly ignored directories.
exclude = [
    "**/*.ipynb",
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
    # Vendored Apache Superset 6.0.0 reference source — kept verbatim for
    # 1:1 porting; not part of the Liteset distribution.
    "superset_old",
]

# Same as Black.
line-length = 88
indent-width = 4

# Assume Python 3.10
target-version = "py310"

[tool.ruff.lint]
# Enable Pyflakes (`F`) and a subset of the pycodestyle (`E`)  codes by default.
# Unlike Flake8, Ruff doesn't enable pycodestyle warnings (`W`) or
# McCabe complexity (`C901`) by default.
select = [
    "B904",
    "E4",
    "E7",
    "E9",
    "PT009",
    "TRY201",
    "B",
    "C",
    "E",
    "F",
    "F",
    "I",
    "N",
    "PT",
    "Q",
    "S",
    "T",
    "TID",
    "W",
]

ignore = [
    "S101",
    "PT006",
    "T201",
    "N999",
]
extend-select = ["I"]

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["TID251"]
"setup.py" = ["TID251"]
"superset/**" = ["TID251"]
"superset/config.py" = ["TID251"]
"superset/cli/main.py" = ["E402"]  # imports after click group definition
# Test code: hardcoded test credentials and `random` for synthetic fixtures
# are intentional and never reach production cryptography paths.
"tests/**" = ["S105", "S106"]
# Vendored Apache Superset 6.0.0 integration tests use relative imports
# throughout — porting them is a separate effort, out of scope for the
# Liteset migration's lint cleanup.
"tests/integration_tests/**" = ["S105", "S106", "TID252"]

[tool.ruff.lint.isort]
case-sensitive = false
combine-as-imports = true
force-sort-within-sections = false
known-first-party = ["superset"]
known-third-party = ["litestar", "msgspec", "pydantic", "pydantic_settings", "structlog", "uvicorn"]
lines-after-imports = -1
order-by-type = false
section-order = [
    "future",
    "standard-library",
    "third-party",
    "first-party",
    "local-folder"
]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"
banned-api = {}

[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "double"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false

# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"

# Enable auto-formatting of code examples in docstrings. Markdown,
# reStructuredText code/literal blocks and doctests are all supported.
#
# This is currently disabled by default, but it is planned for this
# to be opt-out in the future.
docstring-code-format = false

# Set the line length limit used when formatting code snippets in
# docstrings.
#
# This only has an effect when the `docstring-code-format` setting is
# enabled.
docstring-code-line-length = "dynamic"

[tool.liccheck]
requirement_txt_file = "requirements/base.txt"
authorized_licenses = [
    "academic free license (afl)",
    "any-osi",
    "apache license 2.0",
    "apache software",
    "apache software, bsd",
    "bsd",
    "bsd-3-clause",
    "isc license (iscl)",
    "isc license",
    "mit",
    "mit-cmu",
    "mozilla public license 2.0 (mpl 2.0)",
    "osi approved",
    "osi approved",
    "psf-2.0",
    "python software foundation",
    "simplified bsd",
    "the unlicense (unlicense)",
    "the unlicense",
]
[tool.liccheck.authorized_packages]
# --------------------------------------------------------------
# These are ok, checked manually
# Seems ok, might need legal review
# https://github.com/urschrei/pypolyline/blob/master/LICENSE.md
polyline = "2"
# Apache 2.0 https://github.com/hkwi/python-geohash
python-geohash = "0"
# --------------------------------------------------------------

# TODO REMOVE THESE DEPS FROM CODEBASE
paramiko = "3"  # GPL
pyxlsb = "1"  # GPL

[tool.uv]
# sqlalchemy-databricks pins sqlalchemy<2, but superset requires SA 2.0+ for async API.
# Override the transitive constraint so the resolver can proceed.
# Note: the databricks adapter is incompatible with SA 2.x at runtime.
override-dependencies = [
    "sqlalchemy>=2.0, <2.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
