<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - Superset</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto,
        'Helvetica Neue', Arial, sans-serif;
      background: #f7f7f7;
      color: #333;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .login-container {
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
      padding: 40px;
      width: 100%;
      max-width: 400px;
    }
    .login-header {
      text-align: center;
      margin-bottom: 32px;
    }
    .login-header h1 {
      font-size: 28px;
      font-weight: 600;
      color: #20a7c9;
      margin-bottom: 4px;
    }
    .login-header p {
      font-size: 14px;
      color: #999;
    }
    .form-group {
      margin-bottom: 20px;
    }
    .form-group label {
      display: block;
      font-size: 14px;
      font-weight: 500;
      color: #555;
      margin-bottom: 6px;
    }
    .form-group input {
      width: 100%;
      padding: 10px 12px;
      font-size: 14px;
      border: 1px solid #d9d9d9;
      border-radius: 4px;
      outline: none;
      transition: border-color 0.2s;
    }
    .form-group input:focus {
      border-color: #20a7c9;
      box-shadow: 0 0 0 2px rgba(32, 167, 201, 0.15);
    }
    .error-message {
      background: #fff2f0;
      border: 1px solid #ffccc7;
      color: #cf1322;
      padding: 10px 12px;
      border-radius: 4px;
      font-size: 14px;
      margin-bottom: 20px;
    }
    .submit-btn {
      width: 100%;
      padding: 10px 0;
      font-size: 16px;
      font-weight: 500;
      color: #fff;
      background: #20a7c9;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .submit-btn:hover {
      background: #1a8fa8;
    }
    .submit-btn:active {
      background: #157a90;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-header">
      <h1>Superset</h1>
      <p>Sign in to your account</p>
    </div>

    {% if error %}
    <div class="error-message">{{ error }}</div>
    {% endif %}

    <form method="POST" action="/login/">
      <div class="form-group">
        <label for="username">Username</label>
        <input
          type="text"
          id="username"
          name="username"
          autocomplete="username"
          autofocus
          required
        />
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          name="password"
          autocomplete="current-password"
          required
        />
      </div>
      <button type="submit" class="submit-btn">Sign In</button>
    </form>
  </div>
</body>
</html>
