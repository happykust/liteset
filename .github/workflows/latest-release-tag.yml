name: Tags
on:
  release:
    types: [published] # This makes it run only when a new released is published

jobs:
  latest-release:
    name: Add/update tag to new release
    if: github.event.release.prerelease == false
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
    - name: "Checkout ${{ github.ref }} ( ${{ github.sha }} )"
      uses: actions/checkout@v4
      with:
        # The latest-tag action force-pushes the ``latest`` git tag, so the
        # checkout must keep its credentials (default) rather than strip them,
        # and needs full history so the tag walk does not see a grafted HEAD.
        persist-credentials: true
        fetch-depth: 0
        submodules: recursive

    - name: Check for latest tag
      id: latest-tag
      run: |
        source ./scripts/tag_latest_release.sh $(echo ${{ github.event.release.tag_name }}) --dry-run

    - name: Configure Git
      run: |
        git config user.name "$GITHUB_ACTOR"
        git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

    - name: Run latest-tag
      uses: ./.github/actions/latest-tag
      if: (! ${{ steps.latest-tag.outputs.SKIP_TAG }} )
      with:
        description: Liteset latest release
        tag-name: latest
      env:
        GITHUB_TOKEN: ${{ github.token }}
