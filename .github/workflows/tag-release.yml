name: Publish a Release

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: happykust

on:
  release:
    types: [published, edited]

  # Can be triggered manually
  workflow_dispatch:
    inputs:
      release:
        required: true
        description: The version to generate
      git-ref:
        required: true
        description: The git reference to checkout prior to running the docker build
      force-latest:
        required: true
        type: choice
        default: 'false'
        description: Whether to force a latest tag on the release
        options:
          - 'true'
          - 'false'

permissions:
  packages: write
  contents: write

jobs:

  docker-release:
    name: docker-release
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        # Valid Dockerfile build targets are: dev, lean, ci (see repo-root Dockerfile).
        build_preset: ["dev", "lean", "ci"]
      fail-fast: false
    steps:

      - name: "Checkout ${{ github.ref }} ( ${{ github.sha }} )"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine release ref and image tag
        id: release-meta
        shell: bash
        run: |
          RELEASE="${{ github.event.release.tag_name }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RELEASE="${{ github.event.inputs.release }}"
            git checkout "${{ github.event.inputs.git-ref }}"
          fi
          echo "release=${RELEASE}" >> $GITHUB_OUTPUT
          echo "image_tag=${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/liteset:${RELEASE}-${{ matrix.build_preset }}" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          FORCE_LATEST_TAG=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.force-latest }}" = "true" ]; then
            FORCE_LATEST_TAG="--tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/liteset:latest-${{ matrix.build_preset }}"
          fi

          docker buildx build \
            --push \
            --target ${{ matrix.build_preset }} \
            --build-arg INCLUDE_CHROMIUM=false \
            --tag ${{ steps.release-meta.outputs.image_tag }} \
            $FORCE_LATEST_TAG \
            --platform "linux/arm64" \
            --platform "linux/amd64" \
            .

      - name: Checkout main after release build
        if: github.event_name == 'workflow_dispatch'
        run: git checkout main

  python-release:
    name: Build and publish Python package to PyPI
    runs-on: ubuntu-24.04
    permissions:
      # id-token: write enables PyPI Trusted Publishing (OIDC) — no API token needed.
      # Configure the trusted publisher once on PyPI (project → Publishing): owner
      # happykust, repo liteset, workflow tag-release.yml. contents: write is for the
      # GitHub Release asset upload below (job-level perms replace the workflow default).
      id-token: write
      contents: write
    steps:

      - name: "Checkout ${{ github.ref }} ( ${{ github.sha }} )"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install --upgrade build

      - name: Build sdist and wheel
        run: python -m build

      - name: Upload release assets to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to PyPI
        # Uses OIDC Trusted Publishing (no password/secret). Requires the
        # id-token: write permission above and a trusted publisher configured on PyPI.
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
