name: Publish a Release

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: happykust
  IMAGE_NAME: liteset

on:
  release:
    types: [published]

  workflow_dispatch:
    inputs:
      release:
        required: true
        description: The version to generate
      git-ref:
        required: true
        description: The git reference to checkout prior to running the docker build
      force-latest:
        required: true
        type: choice
        default: 'false'
        description: Whether to force a latest tag on the release
        options:
          - 'true'
          - 'false'

permissions:
  packages: write
  contents: write

jobs:

  release-meta:
    name: Resolve and verify the release version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.meta.outputs.version }}
      base_version: ${{ steps.meta.outputs.base_version }}
      git_ref: ${{ steps.meta.outputs.git_ref }}
      push_latest: ${{ steps.meta.outputs.push_latest }}
    steps:

      - name: Resolve the release reference
        id: ref
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "git_ref=${{ github.event.inputs.git-ref }}" >> $GITHUB_OUTPUT
            echo "raw_version=${{ github.event.inputs.release }}" >> $GITHUB_OUTPUT
            echo "push_latest=${{ github.event.inputs.force-latest }}" >> $GITHUB_OUTPUT
          else
            echo "git_ref=${{ github.event.release.tag_name }}" >> $GITHUB_OUTPUT
            echo "raw_version=${{ github.event.release.tag_name }}" >> $GITHUB_OUTPUT
            echo "push_latest=${{ github.event.release.prerelease == false }}" >> $GITHUB_OUTPUT
          fi

      - name: "Checkout ${{ steps.ref.outputs.git_ref }}"
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.ref.outputs.git_ref }}
          fetch-depth: 0

      - name: Verify the version matches the packaged one
        id: meta
        run: |
          VERSION="${{ steps.ref.outputs.raw_version }}"
          VERSION="${VERSION#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(rc[0-9]+)?$ ]]; then
            echo "::error::Release '${VERSION}' is not a MAJOR.MINOR.PATCH[rcN] version."
            exit 1
          fi
          BASE_VERSION="${VERSION%%rc*}"
          PKG_VERSION=$(jq -r .version superset-frontend/package.json)
          if [ "$BASE_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Release '${VERSION}' carries base version '${BASE_VERSION}', but superset-frontend/package.json holds '${PKG_VERSION}'. Bump it there first, then retag."
            exit 1
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "base_version=${BASE_VERSION}" >> $GITHUB_OUTPUT
          echo "git_ref=${{ steps.ref.outputs.git_ref }}" >> $GITHUB_OUTPUT
          echo "push_latest=${{ steps.ref.outputs.push_latest }}" >> $GITHUB_OUTPUT

  docker-release:
    name: docker-release
    needs: release-meta
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        build_preset: ["dev", "lean", "ci"]
      fail-fast: false
    steps:

      - name: "Checkout ${{ needs.release-meta.outputs.git_ref }}"
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-meta.outputs.git_ref }}
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        shell: bash
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ env.IMAGE_NAME }}
          VERSION: ${{ needs.release-meta.outputs.version }}
          PRESET: ${{ matrix.build_preset }}
          PUSH_LATEST: ${{ needs.release-meta.outputs.push_latest }}
        run: |
          TAGS=(--tag "${IMAGE}:${VERSION}-${PRESET}")
          if [ "$PUSH_LATEST" = "true" ]; then
            TAGS+=(--tag "${IMAGE}:latest-${PRESET}")
          fi
          if [ "$PRESET" = "lean" ]; then
            TAGS+=(--tag "${IMAGE}:${VERSION}")
            if [ "$PUSH_LATEST" = "true" ]; then
              TAGS+=(--tag "${IMAGE}:latest")
            fi
          fi

          docker buildx build \
            --push \
            --target "${PRESET}" \
            --build-arg INCLUDE_CHROMIUM=false \
            --build-arg BUILD_TRANSLATIONS=true \
            "${TAGS[@]}" \
            --platform "linux/amd64" \
            .

  python-release:
    name: Build and publish Python package to PyPI
    needs: release-meta
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      id-token: write
      contents: write
    steps:

      - name: "Checkout ${{ needs.release-meta.outputs.git_ref }}"
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-meta.outputs.git_ref }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: superset-frontend/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build frontend assets and translation catalogs
        working-directory: superset-frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build
          npm run build-translation

      - name: Compile message catalogs
        run: |
          pip install -r requirements/translations.txt
          pybabel compile -d superset/translations || true

      - name: Stamp the release version onto the package
        run: |
          stamped=$(mktemp)
          jq --arg v "${{ needs.release-meta.outputs.version }}" '.version = $v' \
            superset-frontend/package.json > "$stamped"
          mv "$stamped" superset-frontend/package.json
          jq -r .version superset-frontend/package.json

      - name: Build sdist and wheel
        run: |
          pip install --upgrade build
          python -m build

      - name: Verify the artifacts are complete
        run: |
          python - <<'PY'
          import glob
          import sys
          import zipfile

          version = "${{ needs.release-meta.outputs.version }}"
          wheel = glob.glob("dist/*.whl")[0]
          if not wheel.startswith(f"dist/liteset-{version}-"):
              sys.exit(f"{wheel} is not the {version} wheel")
          names = zipfile.ZipFile(wheel).namelist()
          missing = []
          if not any(n.startswith("superset/static/assets/") and n.endswith(".js") for n in names):
              missing.append("frontend assets")
          if not any(n.endswith("messages.mo") for n in names):
              missing.append("compiled translations")
          if missing:
              sys.exit(f"{wheel} ships no {' and no '.join(missing)}")
          print(f"{wheel} contains {len(names)} files, assets and translations included")
          PY

      - name: Upload release assets to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
