name: Docs Deployment

on:
  push:
    paths:
      - "docs/**"
      - "README.md"
    branches:
      - "main"

  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-deploy:
    name: Build & Deploy
    runs-on: ubuntu-24.04
    steps:
      - name: "Checkout ${{ github.ref }} ( ${{ github.sha }} )"
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: recursive
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: './docs/.nvmrc'
      - name: yarn install
        working-directory: docs
        run: |
          yarn install --immutable
      - name: yarn build
        working-directory: docs
        run: |
          yarn build
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs/build
          # Custom domain (docusaurus url). Without cname every deploy would wipe
          # the GitHub Pages custom-domain CNAME and the site would 404.
          cname: liteset.happykust.dev
          # The Helm chart repo (superset-helm-release.yml) also lives on gh-pages
          # (index.yaml + *.tgz). keep_files preserves those so docs (index.html +
          # assets) and the Helm repo coexist on the same Pages branch.
          keep_files: true
