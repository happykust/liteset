# Releases the Helm chart directly to the 'gh-pages' branch via chart-releaser:
# it packages the chart, creates a GitHub release, and updates the repo index
# (index.yaml + *.tgz) served at https://liteset.happykust.dev.

name: "Helm: release charts"

on:
  push:
    branches:
      - "main"
      - "[0-9].[0-9]*"
    paths:
      - "helm/**"
  workflow_dispatch:
    inputs:
      ref:
        description: "The branch, tag, or commit SHA to check out"
        required: false
        default: "main"

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      CR_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref_name }}
          persist-credentials: true
          submodules: recursive
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.5.4

      - name: Add bitnami repo dependency
        run: helm repo add bitnami https://charts.bitnami.com/bitnami

      - name: Fetch tags
        # chart-releaser uses git tags to detect already-released chart versions.
        run: git fetch --tags --force

      - name: Run chart-releaser
        uses: ./.github/actions/chart-releaser-action
        with:
          version: v1.6.0
          charts_dir: helm
          mark_as_latest: false
          pages_branch: gh-pages
        env:
          CR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CR_RELEASE_NAME_TEMPLATE: "liteset-helm-chart-{{ .Version }}"
