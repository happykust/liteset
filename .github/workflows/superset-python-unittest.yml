# Python unit tests
name: Python-Unit

on:
  push:
    branches:
      - "main"
      - "[0-9].[0-9]*"
  pull_request:
    types: [synchronize, opened, reopened, ready_for_review]

# cancel previous workflow jobs for PRs
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["previous", "current"]
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - name: "Checkout ${{ github.ref }} ( ${{ github.sha }} )"
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: recursive
      - name: Check for file changes
        id: check
        uses: ./.github/actions/change-detector/
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Setup Python
        uses: ./.github/actions/setup-backend/
        if: steps.check.outputs.python
        with:
          python-version: ${{ matrix.python-version }}
      - name: Python unit tests
        if: steps.check.outputs.python
        env:
          LITESET_SECRET_KEY: test-secret-key-at-least-32-bytes-long-xx
          LITESET_SQLALCHEMY_DATABASE_URI: sqlite+aiosqlite:////tmp/liteset-unit.db
        run: |
          pytest --durations-min=0.5 --cov=superset --cov-report= -p no:cacheprovider --continue-on-collection-errors tests/superset/unit tests/superset/contract
      - name: Upload code coverage
        uses: codecov/codecov-action@v5
        with:
          flags: python,unit
          token: ${{ secrets.CODECOV_TOKEN }}
          verbose: true
          fail_ci_if_error: false
