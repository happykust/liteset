name: Liteset Load Tests

on:
  push:
    branches: ["liteset/cleanup"]
  workflow_dispatch:

jobs:
  load-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: superset
          POSTGRES_PASSWORD: superset
          POSTGRES_DB: superset_test
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 10s
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -e ".[dev]" locust
      - name: Start Liteset
        run: |
          uvicorn liteset.app:create_app --factory --host 0.0.0.0 --port 8088 &
          sleep 5
        env:
          LITESET_SQLALCHEMY_DATABASE_URI: postgresql+asyncpg://superset:superset@localhost:5432/superset_test
          LITESET_SECRET_KEY: test-secret-key-for-ci-32-bytes!
      - name: Run Locust load tests
        run: |
          locust -f tests/liteset/load/locustfile.py \
            --headless \
            --users 50 \
            --spawn-rate 10 \
            --run-time 60s \
            --host http://localhost:8088 \
            --csv results/liteset
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: load-test-results
          path: results/
